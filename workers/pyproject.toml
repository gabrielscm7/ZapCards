[project]
name = "zapcards-workers"
version = "1.0.0"
description = "ZapCards Workers - Processamento assincrono (OCR, conversao, embeddings)"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3.0",
    "groq>=0.15.0",
    "boto3>=1.35.0",
    "markitdown>=0.0.1a4",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "cryptography>=41.0.0",
    "tenacity>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
